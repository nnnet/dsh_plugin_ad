# Example dsh-ad configuration.
#
# Two real-world sources are shown:
#   1. "csgo-market"  — a CS:GO skin marketplace driven by market.csgo.com's
#      public price feed. Demonstrates buyer-cabinet credentials, the
#      csgo.com image CDN URL pattern, and the marketplace renderer.
#   2. "tyan-videos"  — a static list of three mp4 avatars served from
#      static.tyan.ai. Demonstrates the no-poll `staticItems` shape and
#      the video renderer (autoplay muted loop playsinline).
#
# Secrets: prefer the `*Env` fields (read from process.env at request time)
# over the plain `login`/`password`/`apiKey`/`token` fields. The plain
# fields exist for local experimentation; do not commit real credentials
# in that form.
#
# If you'd rather skip the YAML for CS:GO and use the built-in preset
# (src/sources/csgo.ts), call `buildCsgoMarketSource({ currency, imageWidth,
# loginEnv, passwordEnv, ... })` from your code and merge the result into
# `sources[]`. Same for tyan — `buildTyanVideosSource({ videos: [...] })`.

enabled: true
activeSourceId: csgo-market

widget:
  visible: true
  enabled: true
  decorationEnabled: true
  size: 360
  right: 24
  bottom: 20

sources:
  - id: csgo-market
    name: "CS:GO Market"
    enabled: true
    contentTypes: [image, product, chat]

    # Host allowlist: only csgo.com is allowed. Outbound requests to
    # anything else will be rejected before they are sent.
    allowHosts:
      - market.csgo.com
      - cdn.csgo.com
      - cdn2.csgo.com

    # Buyer-cabinet credentials for the marketplace feed. Set these env
    # vars in the host process instead of editing this file:
    #   CSGO_LOGIN, CSGO_PASSWORD
    auth:
      loginEnv: CSGO_LOGIN
      passwordEnv: CSGO_PASSWORD
      extra:
        clientId: "dsh-ad-widget"

    # CS:GO price feed — `https://market.csgo.com/api/v2/prices/RUB.json`
    # returns a flat `{ "<hash_name>": <price_cents>, ... }` map. The
    # adapter recognizes the `__HASH_NAME__` / `__PRICE__` / `__BASE__`
    # sentinels in the mapping and rebuilds each entry into a
    # marketplace product automatically.
    feed:
      url: "https://market.csgo.com/api/v2/prices/RUB.json"
      method: GET
      headers:
        Accept: "application/json"
        User-Agent: "dsh-ad/0.7 (+https://github.com/nnnet/dsh_plugin_ad)"
      timeoutMs: 8000
    pollIntervalMs: 60000
    # Per-source item cap. The default is 500 (was 50 in v0.6 — that was
    # what made the widget show "only a few skins"). The global ceiling
    # is 5_000; sources that need more should narrow the feed server-side.
    maxItems: 500
    maxResponseBytes: 10485760

    mapping:
      id: "__HASH_NAME__"
      title: "__HASH_NAME__"
      priceAmount: "__PRICE__"
      imageBaseUrl: "__BASE__"

    clickThroughUrl: "https://market.csgo.com/item/{itemId}?utm_source=dsh-ad"

    # frequencyCap intentionally NOT set in v0.7: the previous default
    # (5 / 10 min) made the widget go silent after ~2.5 minutes, which
    # users read as "the source has no items". Enable it explicitly if
    # you want impression throttling:
    #   frequencyCap: { maxImpressions: 5, windowMs: 600000 }

    campaign:
      id: csgo-market-rotator
      placement: dsh-ad
      priority: 100
      weight: 10

    tracking:
      impressionUrl: "https://market.csgo.com/api/v2/track/impression"
      clickUrl: "https://market.csgo.com/api/v2/track/click"

    extra:
      __csgoImageWidth: 458
      __csgoCurrency: RUB

  - id: tyan-videos
    name: "Tyan Avatars"
    enabled: true
    contentTypes: [video]

    # Host allowlist for both the static CDN (mp4) and the click-through
    # messenger pages.
    allowHosts:
      - static.tyan.ai
      - tyan.ai
    allowPrivateNetwork: false

    # No `feed` — this source uses `staticItems` (one-shot, no polling).
    # Each item is a (mp4, messenger-page) pair extracted from tyan.ai/en/:
    #   * mediaUrl / media[0].url — the avatar-preview mp4 served from
    #     static.tyan.ai (loaded as muted-autoplay HTML5 video)
    #   * clickUrl — the per-character messenger page, opened in a new tab
    #     when the user clicks the widget (same flow as a skin click)
    #
    # Both fields are required: the client renders <video src={mediaUrl}/>
    # and SimpleCreative falls back to the first media[] entry if mediaUrl
    # is missing. Setting both keeps the wire-shape consistent regardless
    # of which code path the client uses.
    staticItems:
      - id: tyan-1
        type: video
        title: "Emily, 18"
        mediaUrl: "https://static.tyan.ai/avatars/3d9dff10fe3d30660389d15b6d0e78eb5f1a7090.mp4"
        media:
          - kind: video
            url: "https://static.tyan.ai/avatars/3d9dff10fe3d30660389d15b6d0e78eb5f1a7090.mp4"
        clickUrl: "https://tyan.ai/en/messenger?id=28979"
